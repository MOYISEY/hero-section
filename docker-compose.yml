services:
  postgres:
    image: postgres:16-alpine
    container_name: neuralbrief-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neuralbrief
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neuralbrief"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: neuralbrief-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/neuralbrief
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-NeuralBrief <onboarding@resend.dev>}
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      TRELLO_TASKS_LIST_ID: ${TRELLO_TASKS_LIST_ID:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
